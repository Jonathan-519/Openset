# All arms start from the SAME verified trained reference; no TEST-tuned settings.
name: TaxoSafe-Reference-Finetune-Sweep-v1
seed: 1
budget:
  epochs: 20
  patience: 6
  min_epochs: 3
  batches_per_epoch: 240
  prompt_lr: 0.0005
  head_lr: 0.001
arms:
  - id: E00_reference
    kind: baseline
  - id: E01_heads
    kind: finetune
    scope: heads
    anchored: false
    hierarchy: false
  - id: E02_heads_anchor
    kind: finetune
    scope: heads
    anchored: true
    hierarchy: false
  - id: E03_prompt_anchor
    kind: finetune
    scope: prompts_heads
    anchored: true
    hierarchy: false
  - id: E04_hierarchy_anchor
    kind: finetune
    scope: prompts_heads
    anchored: true
    hierarchy: true
  - id: E05_hierarchy_blend
    kind: blend
    parent_arm: E04_hierarchy_anchor
    alpha: 0.5
