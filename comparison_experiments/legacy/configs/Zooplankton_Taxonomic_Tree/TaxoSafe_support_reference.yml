# Opt-in reference membership; original and decoupled configurations remain unchanged.
# Same TRAIN-only gradient permissions, manifests, budget, schedule and four gates.
name: TaxoSafe-Reference-Membership-v3
seed: 1
output_root: runs/taxosafe_new/reference
model:
  arch: maple
  name: ViT-B/16
  prec: fp16
  n_ctx: 2
  ctx_init: a photo of a
  prompt_depth: 3
data:
  name: Zooplankton_TaxoSafe_v11_dcbs
  data_root: prepro/raw/Zooplankton_TT
  near_dev_root: prepro/raw/Zooplankton_NearUnknown_Dev
  near_test_root: prepro/raw/Zooplankton_NearUnknown_Test
  ood_dev_root: prepro/raw/Zooplankton_OOD_Dev
  ood_test_root: prepro/raw/Zooplankton_OOD_Test
  train: prepro/data/Zooplankton_TT_v11_dcbs/gt_train_known.txt
  val_known: prepro/data/Zooplankton_TT_v11_dcbs/gt_val_known.txt
  known_preparation_audit: prepro/data/Zooplankton_TT_v11_dcbs/known_deduplication.json
  val_intra: prepro/data/Zooplankton_TT_v9_rebuild/gt_val_intra_v10.txt
  val_extra: prepro/data/Zooplankton_TT_v9_rebuild/gt_val_extra_v10.txt
  test_known: prepro/data/Zooplankton_TT_v9_rebuild/gt_test_known.txt
  test_intra: prepro/data/Zooplankton_TT_v9_rebuild/gt_test_intra.txt
  test_extra: prepro/data/Zooplankton_TT_v9_rebuild/gt_test_extra.txt
  hierarchy: prepro/data/Zooplankton_TT_v9_rebuild/tree.npy
  num_known_leaves: 23
  batch_size: 12
  eval_batch_size: 16
  n_workers: 4
  transform: clip
  sampler:
    name: hierarchical_episode
    parents_per_batch: 2
    species_per_parent: 3
    images_per_species: 2
    batches_per_epoch: 240
    ensure_rankable_parent: true
    pseudo_holdout_mode: epoch
    hard_sibling_sampling: true
  resize_mode: center_crop
  augment: true
training:
  epochs: 120
  warmup_epochs: 5
  prompt_lr: 0.005
  head_lr: 0.01
  weight_decay: 0.0005
  gradient_clip: 5.0
  patience: 25
  episode_ramp_epochs: 5
  min_episode_epochs: 5
  anchor_temperature: 2.0
calibration:
  decoder: membership
  policy: known_first
  threshold_grid: quantile
  membership_grid_points: 49
  source_loo: true
evaluation_gates:
  known_e2e:
    operator: '>'
    target: 0.9
  near_correct_fallback:
    operator: '>='
    target: 0.85
  extra_root_rejection:
    operator: '>'
    target: 0.9
  open_world_leaf_precision:
    operator: '>'
    target: 0.9
support:
  decoupled: true
  adapter_dim: 64
  local_tokens: 4
  shared_encoder: false
  local_enabled: true
  max_per_leaf: 8
  hidden_dim: 32
  temperature: 0.1
  episodes_enabled: true
  parent_holdout_enabled: true
  loss:
    leaf: 1.0
    parent: 0.25
    episode: 1.0
    paired: 0.25
    control: 0.25
    anchor: 0.5
    support_leaf: 0.25
    support_parent: 0.1
    membership_parent: 1.0
    membership_leaf: 1.0
    parent_cross_species: 0.1
    leaf_sibling: 0.1
    pair_parent: 0.25
    pair_leaf: 0.25
  margins:
    representation: 0.2
    leaf: 0.5
    root: 0.5
    stability: 0.1
  membership: reference
  reference_topk: 2
