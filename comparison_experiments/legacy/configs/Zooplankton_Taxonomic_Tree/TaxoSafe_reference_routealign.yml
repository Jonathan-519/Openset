# Fixed experiments. No TEST-driven thresholds, species rules or weight search.
name: TaxoSafe-Evidence-Aligned-Proximity-v1
seed: 1
budget:
  epochs: 20
  patience: 6
  min_epochs: 3
  batches_per_epoch: 240
  prompt_lr: 0.0005
  head_lr: 0.001
proximity:
  k: 3
  shrinkage: 10.0
router:
  grid_points: 49
  proximity_weight: 1.0
  rerank_weight: 1.0
  proximity_clip: 5.0
  seed: 1
arms:
- id: A00_reference
  kind: baseline
  weights: reference
  router: reference
- id: A01_evidence_anchor
  kind: finetune
  scope: heads
  anchored: true
  evidence_anchor: true
- id: A02_proximity
  kind: routing
  weights: reference
  router: joint
- id: A03_combined
  kind: routing
  weights: A01_evidence_anchor
  router: joint
- id: A04_parent_rerank
  kind: routing
  weights: A01_evidence_anchor
  router: rerank
