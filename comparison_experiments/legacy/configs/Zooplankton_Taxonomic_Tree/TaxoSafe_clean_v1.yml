seed: 1
name: TaxoSafe-v3
model:
  arch: maple
  name: ViT-B/16
  prec: fp16
  n_ctx: 2
  ctx_init: a photo of a
  prompt_depth: 3
data:
  name: Zooplankton_TaxoSafe_fold1_clean_v1
  loader: TaxoSafeDataLoader
  data_root: prepro
  full_data_root: prepro
  ood_root: .
  train: prepro/data/Zooplankton_Taxonomic_Tree_clean_v1/gt_train.txt
  val_known: prepro/data/Zooplankton_Taxonomic_Tree_clean_v1/gt_val_known.txt
  test_known: prepro/data/Zooplankton_Taxonomic_Tree_clean_v1/gt_test_known.txt
  val_intra: prepro/data/Zooplankton_Taxonomic_Tree_clean_v1/gt_val_intra.txt
  test_intra: prepro/data/Zooplankton_Taxonomic_Tree_clean_v1/gt_test_intra.txt
  oe_train: prepro/data/Zooplankton_Taxonomic_Tree_clean_v1/gt_oe_train.txt
  val_extra: prepro/data/Zooplankton_Taxonomic_Tree_clean_v1/gt_val_extra.txt
  test_extra: prepro/data/Zooplankton_Taxonomic_Tree_clean_v1/gt_test_extra.txt
  hierarchy: prepro/data/Zooplankton_Taxonomic_Tree/tree.npy
  num_known_leaves: 17
  batch_size: 8
  eval_batch_size: 16
  n_workers: 4
  transform: clip
  sampler:
    name: hierarchical_episode
    parents_per_batch: 2
    species_per_parent: 2
    images_per_species: 2
    batches_per_epoch: 200
    seed: 1
    ensure_rankable_parent: true
    pseudo_holdout_mode: epoch
    holdout_seed: 1
  split_revision: exact-content-deduplicated-v1
init_label_set: leaf
open_treecut:
  holdout_mode: epoch
  holdout_seed: 1
  collapse_prob: 0.2
  hide_prob: 1.0
  unknown_template: novel member of {}
  force_one_pseudo_per_batch: true
loss:
  name: taxosafe
  lambda_ncl: 0.5
  lambda_cons: 0.1
  lambda_rank: 0.25
  lambda_child_known: 0.1
  lambda_child_novel: 0.5
  lambda_pceg: 0.2
  rank_margin: 0.08
  known_child_margin: 0.3
  pseudo_child_margin: 0.28
  pceg_margin: 0.04
  novelty_warmup_epochs: 5
  lambda_root: 0.2
  known_parent_margin: 0.28
  lambda_oe: 0.0
  min_oe_train_samples: 100
  allow_small_oe: false
  oe_margin: 0.15
  oe_leaf_margin: 0.15
  oe_entropy_weight: 0.1
  oe_leaf_weight: 0.25
  oe_warmup_epochs: 5
calibration:
  selection_policy: balanced
  root_false_accept_limit: 0.05
  over_specification_limit: 0.05
  min_root_correct_parent_acceptance: 0.85
  min_known_correct_leaf_acceptance: 0.65
  branch_specific: true
  min_branch_extra_samples: 20
  min_branch_root_positive_samples: 30
  min_branch_intra_samples: 30
  min_branch_known_samples: 10
  root_grid_points: 800
  child_grid_points: 121
  gap_grid_points: 161
  std_epsilon: 1.0e-06
  moment_shrinkage_strength: 20.0
  risk_curve_points: 41
  child_score_weights:
    child_score: 0.34
    child_margin: 0.33
    child_neg_entropy: 0.33
  root_score_candidates:
  - parent_score
  - parent_margin
  - parent_msp
  - parent_neg_entropy
  - parent_logsumexp
optim:
  name: sgd
  lr: 0.02
  momentum: 0.9
  weight_decay: 0.0005
  sgd_dampening: 0.0
  sgd_nesterov: false
  max_epoch: 200
  early_stopping_patience: 30
  early_stopping_min_delta: 0.0
  lr_scheduler: cosine
  warmup_epoch: 1
  warmup_type: constant
  warmup_cons_lr: 0.001
  use_scheduler: true
eval_freq: 1
print_freq: 20
exp: ViT-B_16/full/TaxoSafe-v3-clean-v1/fold1
