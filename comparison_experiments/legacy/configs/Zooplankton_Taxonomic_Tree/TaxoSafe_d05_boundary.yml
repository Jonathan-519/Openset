name: D05 per-witness boundaries and same-bank cross-query ranking
seed: 1
arms:
- {id: G00_reference, kind: reference, mode: reference, policy: source}
- {id: G01_d05, kind: source, mode: d05, policy: source}
- {id: G02_d05_kp, kind: reuse, mode: d05, policy: kp_frontier, weight_source: G01_d05}
- {id: G03_evm_leaf, kind: evm, mode: evm_leaf, policy: kp_frontier}
- {id: G04_bce8, kind: train, mode: bce8, policy: kp_frontier}
- {id: G05_rank8, kind: train, mode: rank8, policy: kp_frontier}
- {id: G06_bce9, kind: train, mode: bce9, policy: kp_frontier}
- {id: G07_rank9, kind: train, mode: rank9, policy: kp_frontier}
- {id: G08_rank9_standard, kind: reuse, mode: rank9, policy: standard, weight_source: G07_rank9}
- {id: G09_rank9_leaf_guard, kind: leaf_guard, mode: leaf_guard, policy: fixed_parent, weight_source: G07_rank9}
boundary:
  tail_size: 32
training:
  steps: 300
  batch_size: 1024
  lr: 0.001
  l2sp_weight: 0.01
  ranking_weight: 0.2
  ranking_margin: 0.2
calibration:
  seed: 1
  known_target: 0.92
